<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mis gastos</title>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <meta name="theme-color" content="#0b0f18">
  <link rel="stylesheet" href="styles.css">
  <style>
    .contenido { max-width: 552px; margin: 0 auto; padding: 32px 16px 0; }
    h1 { margin-bottom: 24px; }
  </style>
</head>
<body>

<div class="contenido">
  <h1>Nuevo gasto personal</h1>
  <div id="formulario"></div>
  <button class="btn-guardar" id="btnGuardar">Guardar gasto</button>
</div>
<nav class="navbar" id="navbar" data-actual="nuevo"></nav>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="comun.js"></script>
<script src="formulario.js"></script>
<script>
  const form = crearFormulario(document.getElementById("formulario"), "alta");
  const btn = document.getElementById("btnGuardar");
  let enviando = false;
  let idEnvio = null;

  btn.addEventListener("click", guardar);

  function guardar() {
    if (enviando) return;
    const error = form.validar();
    if (error) { mostrarToast(error); return; }

    enviando = true;
    btn.disabled = true;
    btn.textContent = "Guardando...";

    // Clave de idempotencia: si la request se reintenta (red, redirect de Apps
    // Script, iOS), llega el mismo idEnvio y el script no vuelve a escribir.
    if (!idEnvio) idEnvio = nuevoId();

    llamarScript({ accion: "guardar", idEnvio, ...form.getDatos() })
    .then(res => {
      enviando = false;
      btn.disabled = false;
      btn.textContent = "Guardar gasto";
      if (res.error) {
        // Se conserva idEnvio: si reintenta el mismo gasto, no se duplica.
        mostrarToast(mensajeDeError(res));
        return;
      }
      idEnvio = null;
      form.reset();
      mostrarToast(res.cuotas > 1 ? `✓ ${res.cuotas} cuotas guardadas` : "✓ Gasto guardado");
    })
    .catch(() => {
      enviando = false;
      btn.disabled = false;
      btn.textContent = "Guardar gasto";
      mostrarToast("Error al guardar, intentá de nuevo");
    });
  }
</script>
</body>
</html>
