<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Análisis global</title>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <meta name="theme-color" content="#0b0f18">
  <link rel="stylesheet" href="styles.css">
  <style>
    .contenido { max-width: 1120px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 48px) 0; }

    h1 { font-size: clamp(28px, 4vw, 36px); margin-bottom: 28px; }
    .estado { font-size: 15px; color: var(--text-secondary); padding: 24px 0; }

    .seccion { margin-bottom: 40px; }
    .seccion h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .seccion .bajada { font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; }

    .card {
      background: var(--surface); border-radius: var(--radius-card);
      border: 1px solid var(--border); padding: 16px 16px 12px; overflow: visible;
    }
    .fila-cuotas { display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch; }
    .fila-cuotas .card:first-child { flex: 2 1 480px; min-width: 0; }
    .fila-cuotas .card:last-child { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; }

    /* Gráficos */
    .grafico { position: relative; width: 100%; }
    .grafico svg { display: block; width: 100%; overflow: visible; }
    /* Deja scrollear la página en vertical y usa el arrastre horizontal para recorrer los meses */
    .grafico svg { touch-action: pan-y; -webkit-user-select: none; user-select: none; }
    .grafico text { fill: var(--text-secondary); font-size: 12px; font-family: inherit; font-variant-numeric: tabular-nums; }
    .grafico .grilla { stroke: rgba(150,180,255,0.09); stroke-width: 1; }
    .grafico .base { stroke: rgba(150,180,255,0.22); stroke-width: 1; }
    .grafico .zona { fill: transparent; cursor: crosshair; outline: none; }
    .grafico .zona:focus-visible { stroke: var(--text-secondary); stroke-width: 1; }
    .grafico .columna-hit { fill: transparent; cursor: pointer; outline: none; }
    .grafico .columna-hit:focus-visible { stroke: var(--text-secondary); }

    .leyenda-graf { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 12px; font-size: 14px; color: var(--text-secondary); }
    .leyenda-graf span { display: inline-flex; align-items: center; gap: 6px; }
    .leyenda-graf i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

    .tooltip {
      position: absolute; pointer-events: none; z-index: 10; min-width: 140px;
      background: var(--surface-alta); border: 1px solid var(--border-fuerte);
      border-radius: 10px; padding: 8px 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      font-size: 13px; color: var(--text-secondary); opacity: 0; transition: opacity 0.1s;
    }
    .tooltip.visible { opacity: 1; }
    .tooltip .t-titulo { margin-bottom: 4px; }
    .tooltip .t-fila { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .tooltip .t-fila b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .tooltip .t-key { display: inline-flex; align-items: center; gap: 6px; }
    .tooltip .t-key i { width: 10px; height: 2px; border-radius: 1px; display: inline-block; }

    details.tabla { margin-top: 8px; font-size: 14px; color: var(--text-secondary); }
    details.tabla summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; }
    details.tabla .scroll { max-height: 280px; overflow: auto; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--label); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    td.num, th.num { text-align: right; }
    td { color: var(--text); }

    /* Listado de cuotas */
    .lista-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; min-height: 32px; }
    .lista-cab .rotulo { font-size: var(--font-label); font-weight: 500; color: var(--label); text-transform: uppercase; letter-spacing: 0.04em; }
    .lista-cab button {
      border: 1.5px solid var(--border); background: transparent; color: var(--text-secondary);
      font-family: inherit; font-size: 13px; border-radius: 100px; padding: 4px 12px; cursor: pointer; min-height: 32px;
    }
    .lista-cuotas { flex: 1; overflow-y: auto; max-height: 360px; padding-right: 12px; }
    .cuotas-al-dia { font-size: 13px; color: var(--text-secondary); margin: -4px 0 4px; }
    .lista-cuotas .vacio { font-size: 15px; color: var(--text-secondary); padding: 12px 2px; }
    .cuota { display: flex; flex-direction: column; gap: 6px; padding: 12px 2px; border-bottom: 1px solid var(--border); }
    .cuota:last-child { border-bottom: none; }
    .cuota .arriba, .cuota .abajo { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .cuota .desc { font-size: 15px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cuota .monto { font-size: 15px; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .cuota .abajo { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .cuota .faltan { color: var(--text); font-weight: 500; }
    .cuota .avance { height: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; }
    .cuota .avance div { height: 100%; border-radius: 4px; background: #3987e5; }
  </style>
</head>
<body>

<div class="contenido">
  <h1>Análisis global</h1>

  <p class="estado" id="estado">Cargando gastos…</p>

  <div id="secciones" class="hidden">
    <section class="seccion">
      <h2>Gastado por mes</h2>
      <p class="bajada">Todo lo que no es inversión, mes a mes.</p>
      <div class="card">
        <div class="grafico" id="grafGastado"></div>
        <details class="tabla"><summary>Ver datos</summary><div class="scroll" id="tablaGastado"></div></details>
      </div>
    </section>

    <section class="seccion">
      <h2>Invertido por mes</h2>
      <p class="bajada">Cuánto invertiste cada mes y en qué.</p>
      <div class="card">
        <div class="leyenda-graf" id="leyendaInv"></div>
        <div class="grafico" id="grafInvertido"></div>
        <details class="tabla"><summary>Ver datos</summary><div class="scroll" id="tablaInvertido"></div></details>
      </div>
    </section>

    <section class="seccion">
      <h2>Cuotas</h2>
      <p class="bajada">Lo que pagás en cuotas cada mes. Tocá un mes para ver qué compras tienen cuota ese mes.</p>
      <div class="fila-cuotas">
        <div class="card">
          <div class="grafico" id="grafCuotas"></div>
          <details class="tabla"><summary>Ver datos</summary><div class="scroll" id="tablaCuotas"></div></details>
        </div>
        <div class="card">
          <div class="lista-cab">
            <span class="rotulo" id="cuotasTitulo">Gastos en cuotas</span>
            <button class="hidden" id="cuotasTodas">Ver todas</button>
          </div>
          <p class="cuotas-al-dia" id="cuotasAlDia"></p>
          <div class="lista-cuotas" id="listaCuotas"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<nav class="navbar" id="navbar" data-actual="global"></nav>

<script src="config.js"></script>
<script src="comun.js"></script>
<script src="formulario.js"></script>
<script src="analisis.js"></script>
</body>
</html>
